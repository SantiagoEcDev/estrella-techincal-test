AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Education Estrella backend

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: estrella-health
      CodeUri: .
      Handler: src/handlers/health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"